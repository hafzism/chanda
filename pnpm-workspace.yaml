packages:
  - apps/*
  - packages/*

allowBuilds:
  '@firebase/util': false
  '@google/genai': false
  esbuild: true
  msgpackr-extract: false
  protobufjs: false
  sharp: true

minimumReleaseAgeExclude:
  - tsx@4.23.12

onlyBuiltDependencies:
  - '@nestjs/core'
  - esbuild
  - sharp

overrides:
  '@angular-devkit/core>ajv': 8.18.0
  '@esbuild-kit/core-utils>esbuild': 0.25.12
  'brace-expansion@<1.1.18': 1.1.18
  'brace-expansion@>=2.0.0 <2.1.4': 2.1.4
  'brace-expansion@>=4.0.0 <5.0.9': 5.0.9
  'fast-uri@>=3.0.0 <3.1.5': 3.1.5
  'fast-xml-parser@>=5.9.3 <5.10.1': 5.10.1
  'js-yaml@>=4.0.0 <4.3.1': 4.3.1
  'nanoid@>=3.0.0 <3.3.18': 3.3.18
  picomatch: 4.0.4
  postcss: 8.5.23
  uuid: 11.1.1
