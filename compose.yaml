name: suppline-ai

services:
  postgres:
    image: pgvector/pgvector:0.8.1-pg17@sha256:3e8b3adfd27b5707128f60956f62a793c3c9326ea8cfaf0eab7adccb5d700b21
    environment:
      POSTGRES_DB: suppline
      POSTGRES_PASSWORD: suppline
      POSTGRES_USER: suppline
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U suppline -d suppline']
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - '${POSTGRES_PORT:-55432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:8-alpine@sha256:9d317178eceac8454a2284a9e6df2466b93c745529947f0cd42a0fa9609d7005
    command: redis-server --appendonly yes
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - '${REDIS_PORT:-56379}:6379'
    volumes:
      - redis_data:/data

  minio:
    image: minio/minio:latest@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_PASSWORD: change-this-local-secret
      MINIO_ROOT_USER: suppline
    healthcheck:
      test: [CMD, mc, ready, local]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - '${MINIO_API_PORT:-59000}:9000'
      - '${MINIO_CONSOLE_PORT:-59001}:9001'
    volumes:
      - minio_data:/data

volumes:
  minio_data:
  postgres_data:
  redis_data:
